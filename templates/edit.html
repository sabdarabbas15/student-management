<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Edit Student</h2>

<form method="POST">

    <input class="form-control mb-2" name="name" value="{{ student['name'] }}">

    <input class="form-control mb-2" name="email" value="{{ student['email'] }}">

    <input class="form-control mb-2" name="class_name" value="{{ student['class_name'] }}">

    <input class="form-control mb-2" name="subject" value="{{ student['subject'] }}">

    <input class="form-control mb-2" name="marks" value="{{ student['marks'] }}">

    <button class="btn btn-primary">Update Student</button>

</form>

</body>
</html>
