<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Add Student</h2>

<form method="POST">

    <input class="form-control mb-2" name="name" placeholder="Name">

    <input class="form-control mb-2" name="email" placeholder="Email">

    <input class="form-control mb-2" name="password" placeholder="Password">

    <input class="form-control mb-2" name="class_name" placeholder="Class">

    <input class="form-control mb-2" name="subject" placeholder="Subject">

    <input class="form-control mb-2" name="marks" placeholder="Marks">

    <button class="btn btn-success">Save Student</button>

</form>

</body>
</html>
