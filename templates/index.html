<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Teacher Dashboard</h2>

<form method="GET" class="row g-2 mb-3">

    <div class="col-md-4">
        <input type="text" name="name" class="form-control" placeholder="Search by Name">
    </div>

    <div class="col-md-4">
        <input type="text" name="class_name" class="form-control" placeholder="Search by Class">
    </div>

    <div class="col-md-2">
        <button class="btn btn-primary">Filter</button>
    </div>

    <div class="col-md-2">
        <a href="/add" class="btn btn-success">Add Student</a>
    </div>

</form>

<div class="row">

{% for student in students %}

<div class="col-md-4">

    <div class="card mb-3">

        <div class="card-body">

            <h5>{{ student['name'] }}</h5>

            <p>Email: {{ student['email'] }}</p>
            <p>Class: {{ student['class_name'] }}</p>
            <p>Subject: {{ student['subject'] }}</p>
            <p>Marks: {{ student['marks'] }}</p>

            <a href="/edit/{{ student['id'] }}" class="btn btn-warning">Edit</a>

            <a href="/delete/{{ student['id'] }}" class="btn btn-danger">Delete</a>

        </div>

    </div>

</div>

{% endfor %}

</div>

</body>
</html>
